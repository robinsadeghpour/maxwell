<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="hljs.css">
<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<style>
  :root { color-scheme: dark; --fg:#e6e7e9; --dim:#a2a6ac; --faint:#6b6f76; --line:rgba(255,255,255,.08); --code:rgba(255,255,255,.05); --accent:#c88bff; --size:12px; --prose: "JetBrains Mono", ui-monospace, monospace; }
  html,body { background: transparent; margin:0; }
  body { color:var(--fg); font: var(--size)/1.65 var(--prose); padding: 2px 18px 60px; -webkit-font-smoothing: antialiased; }
  #doc { max-width: 820px; }
  #doc img { max-width: 100%; height: auto; }
  body.code .hljs { color: var(--fg); }
  body.code.plain pre { white-space: pre-wrap; word-break: break-word; }
  body.grid { padding: 0; }
  body.grid table { margin: 0; font-size: var(--size); line-height: 1.5; border: 0; }
  body.grid th, body.grid td { border: 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px 10px; max-width: 240px; vertical-align: top; }
  body.grid th:first-child, body.grid td:first-child { padding-left: 14px; }
  body.grid td > div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  body.grid th { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #edge { position: fixed; top: 0; right: 0; bottom: 0; width: 16px; pointer-events: none; display: none; }
  body.grid th { position: sticky; top: 0; background: var(--code); backdrop-filter: blur(8px); text-align: left; }
  body.grid .more { color: var(--faint); padding: 8px 10px; }
  h1,h2,h3,h4 { line-height:1.25; margin: 1.4em 0 .5em; font-weight: 600; }
  h1 { font-size: 1.6em; border-bottom:1px solid var(--line); padding-bottom:.3em; }
  h2 { font-size: 1.3em; border-bottom:1px solid var(--line); padding-bottom:.25em; }
  h3 { font-size: 1.1em; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  code, pre { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; font-size: calc(var(--size) - .5px); }
  :not(pre) > code { background: var(--code); padding: .1em .35em; border-radius: 4px; }
  pre { background: var(--code); border:1px solid var(--line); border-radius: 3px; padding: 10px 12px; overflow:auto; }
  pre code.hljs { background: transparent; padding: 0; }
  table { border-collapse: collapse; margin: 1em 0; display:block; overflow:auto; }
  th, td { border: 1px solid var(--line); padding: 5px 10px; text-align:left; vertical-align: top; }
  th { background: var(--code); font-weight:600; }
  blockquote { margin: 0; padding: 0 1em; color: var(--dim); border-left: 3px solid var(--line); }
  hr { border:0; border-top:1px solid var(--line); }
  li > input[type=checkbox] { margin: 0 .45em 0 -1.3em; vertical-align: middle; }
  li:has(> input[type=checkbox]) { list-style: none; }
  body.code { padding: 0; }
  body.code pre { margin:0; border:0; border-radius:0; background: transparent; padding: 6px 14px; font-size: var(--size); line-height: 1.5; }
  ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--faint); opacity: .6; border-radius: 2px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { border-width: 2px; }
  ::-webkit-scrollbar-corner { background: transparent; }
  #flash { position: fixed; top: 6px; right: 10px; font: 11px "JetBrains Mono", ui-monospace, monospace; color: var(--faint); opacity: 0; transition: opacity .3s; }
  #flash.on { opacity: 1; }
  /* Dark ink on paper thins out under grayscale smoothing at 1x; the system default keeps it at full weight. */
  body.light { -webkit-font-smoothing: auto; font-weight: 500; }
  body.light .hljs { color:#24292e } body.light .hljs-keyword, body.light .hljs-doctag, body.light .hljs-type { color:#cf222e }
  body.light .hljs-title, body.light .hljs-title.function_ { color:#8250df } body.light .hljs-string, body.light .hljs-regexp { color:#0a3069 }
  body.light .hljs-attr, body.light .hljs-number, body.light .hljs-literal, body.light .hljs-variable, body.light .hljs-meta { color:#0550ae }
  body.light .hljs-comment, body.light .hljs-code { color:#6e7781 } body.light .hljs-built_in, body.light .hljs-symbol { color:#953800 }
  body.light .hljs-name, body.light .hljs-selector-tag, body.light .hljs-quote { color:#116329 }
  body.light .hljs-subst, body.light .hljs-template-variable, body.light .hljs-params, body.light .hljs-property { color:#24292e }
  body.light .hljs-section, body.light .hljs-bullet, body.light .hljs-link, body.light .hljs-attribute,
  body.light .hljs-selector-class, body.light .hljs-selector-id, body.light .hljs-selector-attr, body.light .hljs-selector-pseudo { color:#0550ae }
  body.light .hljs-addition { color:#116329 } body.light .hljs-deletion { color:#82071e }
</style></head>
<body><div id="doc"></div><div id="flash">reloaded</div>
<script>
marked.setOptions({ gfm: true });
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
let scheme = 'dark';
function setTheme(t) {
  const r = document.documentElement.style;
  for (const k of ['fg','dim','faint','line','code','accent']) r.setProperty('--' + k, t[k]);
  r.setProperty('--size', t.size + 'px');
  r.setProperty('--prose', t.prose === 'sans' ? '-apple-system, "SF Pro Text", sans-serif' : '"JetBrains Mono", ui-monospace, monospace');
  r.colorScheme = t.scheme;
  scheme = t.scheme;
  document.body.classList.toggle('light', scheme === 'light');
}
// Rows of a TSV or CSV; CSV fields may be quoted ("a, b" and "" for a quote).
function parseRows(text, sep) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"' && sep === ',' && f === '') { q = true; continue; }
    if (c === sep) { row.push(f); f = ''; continue; }
    if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; continue; }
    f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function render(p) {
  const doc = document.getElementById('doc');
  const y = window.scrollY;
  document.body.className = p.kind + (p.lang === 'plaintext' ? ' plain' : '') + (scheme === 'light' ? ' light' : '');
  let base = document.querySelector('base') || document.head.appendChild(document.createElement('base'));
  base.href = 'file://' + encodeURI(p.base);
  if (p.kind === 'code' && (p.ext === 'tsv' || p.ext === 'csv') && p.text.length < 5000000) {
    // A table, not wrapped text: the first row is the header.
    const rows = parseRows(p.text, p.ext === 'tsv' ? '\t' : ',');
    const shown = rows.slice(0, 5000);
    // Columns up to 240px, cells cut at two lines; the whole text shows on hover.
    const attr = v => esc(v).replace(/"/g, '&quot;');
    let h = '<table><thead><tr>' + (shown[0] || []).map(v => '<th title="' + attr(v) + '">' + esc(v) + '</th>').join('') + '</tr></thead><tbody>';
    for (const r of shown.slice(1)) h += '<tr>' + r.map(v => '<td title="' + attr(v) + '"><div>' + esc(v) + '</div></td>').join('') + '</tr>';
    h += '</tbody></table>';
    if (rows.length > shown.length) h += '<div class="more">' + (rows.length - shown.length) + ' more rows</div>';
    doc.innerHTML = h;
    document.body.className = 'grid' + (scheme === 'light' ? ' light' : '');
  } else if (p.kind === 'md') {
    doc.innerHTML = marked.parse(p.text);
    doc.querySelectorAll('pre code').forEach(el => {
      if (el.textContent.length < 200000) hljs.highlightElement(el);
    });
  } else {
    // Highlight cost grows with size; very big files stay plain.
    const big = p.text.length > 1000000;
    const html = (big || p.lang === 'plaintext') ? esc(p.text) : hljs.highlight(p.text, { language: p.lang, ignoreIllegals: true }).value;
    doc.innerHTML = '<pre><code class="hljs">' + html + '</code></pre>';
  }
  if (p.reload) {
    window.scrollTo(0, y);
    const f = document.getElementById('flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 700);
  } else {
    window.scrollTo(0, p.scroll || 0);
  }
}
</script></body></html>
